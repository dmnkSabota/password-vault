<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="100%" height="auto"
     font-family="'Segoe UI', Arial, sans-serif">

  <defs>
    <marker id="f" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#c9d1d9"/>
    </marker>
    <marker id="r" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#484f58"/>
    </marker>
  </defs>

  <rect width="860" height="400" fill="#0d1117"/>

  <!-- ── Flutter ── -->
  <rect x="10" y="10" width="240" height="380" rx="6" fill="#161b22" stroke="#388bfd" stroke-width="2"/>
  <rect x="10" y="10" width="240" height="50" rx="6" fill="#388bfd"/>
  <rect x="10" y="40"  width="240" height="20" fill="#388bfd"/>
  <text x="130" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Flutter (Android)</text>
  <text x="130" y="52" text-anchor="middle" font-size="9.5" fill="#cfe3ff" letter-spacing="1">PRESENTATION TIER</text>

  <text x="26" y="82"  font-size="9" font-weight="700" fill="#79c0ff" letter-spacing="1">NETWORKING</text>
  <text x="26" y="98"  font-size="12" font-weight="600" fill="#e6edf3">Dio + AuthInterceptor</text>
  <text x="26" y="114" font-size="11" fill="#8b949e">JWT on every request</text>
  <text x="26" y="129" font-size="11" fill="#8b949e">Silent refresh on 401</text>

  <line x1="26" y1="140" x2="234" y2="140" stroke="#30363d" stroke-width="1"/>

  <text x="26" y="158" font-size="9" font-weight="700" fill="#79c0ff" letter-spacing="1">NAVIGATION</text>
  <text x="26" y="174" font-size="12" font-weight="600" fill="#e6edf3">Riverpod + go_router</text>
  <text x="26" y="190" font-size="11" fill="#8b949e">Auth &amp; lock route guards</text>
  <text x="26" y="205" font-size="11" fill="#8b949e">Reactive state management</text>

  <line x1="26" y1="216" x2="234" y2="216" stroke="#30363d" stroke-width="1"/>

  <text x="26" y="234" font-size="9" font-weight="700" fill="#79c0ff" letter-spacing="1">ON-DEVICE SECURITY</text>
  <text x="26" y="250" font-size="12" font-weight="600" fill="#e6edf3">Keystore + local_auth</text>
  <text x="26" y="266" font-size="11" fill="#8b949e">Hardware-backed token store</text>
  <text x="26" y="281" font-size="11" fill="#8b949e">Biometric unlock</text>
  <text x="26" y="296" font-size="11" fill="#8b949e">Auto-lock after 120 s</text>
  <text x="26" y="311" font-size="11" fill="#8b949e">Clipboard clears after 30 s</text>

  <!-- Arrow 1 -->
  <line x1="252" y1="170" x2="308" y2="170" stroke="#c9d1d9" stroke-width="1.5" marker-end="url(#f)"/>
  <text x="280" y="160" text-anchor="middle" font-size="9.5" font-weight="700" fill="#e6edf3">HTTPS + JWT</text>
  <line x1="308" y1="198" x2="252" y2="198" stroke="#484f58" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#r)"/>
  <text x="280" y="214" text-anchor="middle" font-size="9.5" fill="#484f58">JSON</text>

  <!-- ── Django ── -->
  <rect x="310" y="10" width="260" height="380" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <rect x="310" y="10" width="260" height="50" rx="6" fill="#238636"/>
  <rect x="310" y="40"  width="260" height="20" fill="#238636"/>
  <text x="440" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Django REST API</text>
  <text x="440" y="52" text-anchor="middle" font-size="9.5" fill="#ccffd4" letter-spacing="1">APPLICATION TIER</text>

  <text x="326" y="82"  font-size="9" font-weight="700" fill="#56d364" letter-spacing="1">AUTHENTICATION</text>
  <text x="326" y="98"  font-size="12" font-weight="600" fill="#e6edf3">JWT — simplejwt</text>
  <text x="326" y="114" font-size="11" fill="#8b949e">Access: 60 min</text>
  <text x="326" y="129" font-size="11" fill="#8b949e">Refresh: 7 days, rotated on use</text>
  <text x="326" y="144" font-size="11" fill="#8b949e">Blacklisted on logout</text>

  <line x1="326" y1="156" x2="554" y2="156" stroke="#30363d" stroke-width="1"/>

  <text x="326" y="174" font-size="9" font-weight="700" fill="#56d364" letter-spacing="1">RATE LIMITING</text>
  <text x="326" y="190" font-size="12" font-weight="600" fill="#e6edf3">django-ratelimit</text>
  <text x="326" y="206" font-size="11" fill="#8b949e">5 req / min per IP</text>
  <text x="326" y="221" font-size="11" fill="#8b949e">Login &amp; register only</text>

  <line x1="326" y1="232" x2="554" y2="232" stroke="#30363d" stroke-width="1"/>

  <text x="326" y="250" font-size="9" font-weight="700" fill="#56d364" letter-spacing="1">ENCRYPTION</text>
  <text x="326" y="266" font-size="12" font-weight="600" fill="#e6edf3">AES-256-GCM per field</text>
  <text x="326" y="282" font-size="11" fill="#8b949e">Unique nonce per call</text>
  <text x="326" y="297" font-size="11" fill="#8b949e">GCM tag detects tampering</text>
  <text x="326" y="312" font-size="11" fill="#8b949e">Plaintext never stored</text>

  <line x1="326" y1="323" x2="554" y2="323" stroke="#30363d" stroke-width="1"/>

  <text x="326" y="341" font-size="9" font-weight="700" fill="#56d364" letter-spacing="1">DATA ACCESS</text>
  <text x="326" y="357" font-size="12" font-weight="600" fill="#e6edf3">User-scoped queries</text>
  <text x="326" y="373" font-size="11" fill="#8b949e">Filtered by request.user</text>

  <!-- Arrow 2 -->
  <line x1="572" y1="170" x2="608" y2="170" stroke="#c9d1d9" stroke-width="1.5" marker-end="url(#f)"/>
  <text x="590" y="160" text-anchor="middle" font-size="9.5" font-weight="700" fill="#e6edf3">SQL</text>
  <line x1="608" y1="198" x2="572" y2="198" stroke="#484f58" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#r)"/>
  <text x="590" y="214" text-anchor="middle" font-size="9.5" fill="#484f58">rows</text>

  <!-- ── PostgreSQL ── -->
  <rect x="610" y="10" width="240" height="380" rx="6" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <rect x="610" y="10" width="240" height="50" rx="6" fill="#9e6a03"/>
  <rect x="610" y="40"  width="240" height="20" fill="#9e6a03"/>
  <text x="730" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">PostgreSQL</text>
  <text x="730" y="52" text-anchor="middle" font-size="9.5" fill="#ffe6a0" letter-spacing="1">DATA TIER</text>

  <text x="626" y="82" font-size="9" font-weight="700" fill="#e3b341" letter-spacing="1">TABLES</text>

  <rect x="626" y="90" width="208" height="84" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="642" y="110" font-size="12" font-weight="700" fill="#f0883e">vault_credential</text>
  <text x="642" y="128" font-size="11" fill="#8b949e">username, password,</text>
  <text x="642" y="143" font-size="11" fill="#8b949e">url, notes — encrypted</text>
  <text x="642" y="158" font-size="11" fill="#8b949e">title — plaintext</text>

  <rect x="626" y="184" width="208" height="68" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="642" y="204" font-size="12" font-weight="700" fill="#f0883e">token_blacklist</text>
  <text x="642" y="222" font-size="11" fill="#8b949e">Invalidated JTI tokens</text>
  <text x="642" y="238" font-size="11" fill="#8b949e">Checked on refresh</text>

  <rect x="626" y="262" width="208" height="68" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="642" y="282" font-size="12" font-weight="700" fill="#f0883e">auth_user</text>
  <text x="642" y="300" font-size="11" fill="#8b949e">PBKDF2-SHA256 password</text>
  <text x="642" y="316" font-size="11" fill="#8b949e">Django built-in model</text>

</svg>
